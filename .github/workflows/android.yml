name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Web files and Capacitor project
        run: |
          npm install --no-audit --no-fund
          npm run www
          npx cap add android
          npx cap sync android

      - name: Native Bluetooth bridge, permissions, app version
        run: |
          python3 android-src/patch.py

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Publish as the "android" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o "APP_VERSION = '[^']*'" app.js | cut -d"'" -f2)
          cp android/app/build/outputs/apk/release/app-release.apk "flow8-control.apk"
          # keep the release and replace its file; GitHub sometimes answers 5xx here, so retry,
          # and as a last resort add the file under a versioned name so there is always a download
          NOTES="Apka na Androida, wersja v$VER. Pobierz plik flow8-control.apk na telefonie i zainstaluj."
          if gh release view android >/dev/null 2>&1; then
            ok=0
            for n in 1 2 3 4; do
              if gh release upload android "flow8-control.apk" --clobber; then ok=1; break; fi
              sleep $((n * 20))
            done
            if [ "$ok" = 0 ]; then
              cp "flow8-control.apk" "flow8-control-v$VER.apk"
              gh release upload android "flow8-control-v$VER.apk" --clobber
              NOTES="Apka na Androida, wersja v$VER: plik flow8-control-v$VER.apk (stary plik flow8-control.apk nie dal sie podmienic)."
            fi
            gh release edit android --title "FLOW 8 Control v$VER (Android)" --notes "$NOTES" --latest || true
          else
            gh release create android "flow8-control.apk" --title "FLOW 8 Control v$VER (Android)" --notes "$NOTES" --latest
          fi
